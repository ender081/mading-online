<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mading Digital Pondok</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-brand">
      <h1>Mading Digital Pondok</h1>
    </div>

    <div id="guest-nav" class="nav-user">
      <button id="btn-show-login" class="btn btn-outline">Masuk</button>
      <button id="btn-show-register" class="btn btn-primary">Daftar</button>
    </div>

    <div id="user-nav" class="nav-user hidden">
      <span id="user-role-badge" class="badge">SANTRI</span>
      <span id="user-name-display" style="font-weight: 600;">Nama User</span>
      <a id="btn-admin-panel" href="/admin.html" class="btn btn-outline hidden">Panel Admin</a>
      <button id="btn-logout" class="btn btn-outline">Keluar</button>
    </div>
  </nav>

  <!-- KONTEN UTAMA -->
  <main class="container">

    <div id="status-box-container" class="hidden"></div>

    <div class="dashboard-actions">
      <h2>Postingan Mading</h2>
      <button id="btn-create-post" class="btn btn-primary hidden">+ Buat Postingan</button>
    </div>

    <div class="mading-grid" id="mading-grid">
      <!-- Postingan dimuat lewat JavaScript -->
    </div>
  </main>

  <!-- MODAL BUAT POSTINGAN -->
  <div id="modal-create-post" class="modal-overlay hidden">
    <div class="modal">
      <h2>Tulis Postingan Baru</h2>
      <form id="form-create-post">
        <div class="form-group">
          <label for="post-title">Judul Postingan</label>
          <input type="text" id="post-title" required placeholder="Contoh: Jadwal Kajian Rutin">
        </div>
        <div class="form-group">
          <label for="post-category">Kategori</label>
          <select id="post-category" required>
            <option value="PENGUMUMAN">Pengumuman</option>
            <option value="ARTIKEL">Artikel & Opini</option>
            <option value="KARYA SANTRI">Karya Santri / Puisi</option>
            <option value="KEGIATAN">Jadwal & Kegiatan</option>
          </select>
        </div>
        <div class="form-group">
          <label for="post-content">Isi Postingan</label>
          <textarea id="post-content" rows="5" required placeholder="Tuliskan isi informasi di sini..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline btn-close-modal">Batal</button>
          <button type="submit" class="btn btn-primary">Terbitkan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL LOGIN -->
  <div id="modal-login" class="modal-overlay hidden">
    <div class="modal">
      <h2>Masuk ke Akun</h2>
      <form id="form-login">
        <div class="form-group">
          <label for="login-username">Username / ID Santri</label>
          <input type="text" id="login-username" required placeholder="Masukkan username">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline btn-close-modal">Batal</button>
          <button type="submit" class="btn btn-primary">Masuk</button>
        </div>
      </form>
      <div class="auth-toggle">
        Belum punya akun? <a href="#" id="link-to-register">Daftar di sini</a>
      </div>
    </div>
  </div>

  <!-- MODAL REGISTER -->
  <div id="modal-register" class="modal-overlay hidden">
    <div class="modal">
      <h2>Buat Akun Baru</h2>
      <form id="form-register">
        <div class="form-group">
          <label for="reg-name">Nama Lengkap</label>
          <input type="text" id="reg-name" required placeholder="Nama Lengkap Santri">
        </div>
        <div class="form-group">
          <label for="reg-username">Username / ID Santri</label>
          <input type="text" id="reg-username" required placeholder="Buat username unik">
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required placeholder="••••••••">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline btn-close-modal">Batal</button>
          <button type="submit" class="btn btn-primary">Daftar</button>
        </div>
      </form>
      <div class="auth-toggle">
        Sudah punya akun? <a href="#" id="link-to-login">Masuk di sini</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
