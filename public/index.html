<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mading Digital Pondok</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-brand">
      <h1>Mading Digital Pondok</h1>
    </div>

    <div id="guest-nav" class="nav-user">
      <button id="btn-show-login" class="btn btn-outline">Masuk</button>
      <button id="btn-show-register" class="btn btn-primary">Daftar</button>
    </div>

    <div id="user-nav" class="nav-user hidden">
      <span id="user-role-badge" class="badge">SANTRI</span>
      <span id="user-name-display" style="font-weight: 600;">Nama User</span>
      <a id="btn-admin-panel" href="/admin.html" class="btn btn-outline hidden">Panel Admin</a>
      <button id="btn-logout" class="btn btn-outline">Keluar</button>
    </div>
  </nav>

  <!-- KONTEN UTAMA -->
  <main class="container">
    <div id="status-box-container" class="hidden"></div>

    <div class="dashboard-actions">
      <h2>Postingan Mading</h2>
      <button id="btn-create-post" class="btn btn-primary hidden">+ Buat Postingan</button>
    </div>

    <div class="mading-grid" id="mading-grid">
      <!-- Postingan dimuat lewat JavaScript -->
    </div>
  </main>

  <!-- MODAL LAPORKAN POSTINGAN -->
  <div id="modal-report-post" class="modal-overlay hidden">
    <div class="modal">
      <h2>⚠️ Laporkan Postingan</h2>
      <form id="form-report-post">
        <input type="hidden" id="report-post-id">
        <div class="form-group">
          <label for="report-reason">Alasan Pelaporan</label>
          <select id="report-reason" required>
            <option value="">-- Pilih Alasan --</option>
            <option value="Konten Tidak Senonoh / Vulgar">Konten Tidak Senonoh / Vulgar</option>
            <option value="Ujaran Kebencian / SARA / Bullying">Ujaran Kebencian / SARA / Bullying</option>
            <option value="Informasi Palsu / Hoaks / Penipuan">Informasi Palsu / Hoaks / Penipuan</option>
            <option value="Spam / Iklan Mengganggu">Spam / Iklan Mengganggu</option>
            <option value="Pelanggaran Peraturan Pondok">Pelanggaran Peraturan Pondok</option>
          </select>
        </div>
        <div class="form-group">
          <label for="report-details">Catatan Tambahan (Opsional)</label>
          <textarea id="report-details" rows="3" placeholder="Jelaskan secara singkat bagian mana yang melanggar..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline btn-close-modal">Batal</button>
          <button type="submit" class="btn" style="background-color: #ef4444; color: white; border: none;">Kirim Laporan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL BUAT POSTINGAN -->
  <div id="modal-create-post" class="modal-overlay hidden">
    <div class="modal">
      <h2>Tulis Postingan Baru</h2>
      <form id="form-create-post">
        <div class="form-group">
          <label for="post-title">Judul Postingan</label>
          <input type="text" id="post-title" required placeholder="Contoh: Jadwal Kajian Rutin">
        </div>
        <div class="form-group">
          <label for="post-category">Kategori</label>
          <select id="post-category" required>
            <option value="PENGUMUMAN">Pengumuman</option>
            <option value="ARTIKEL">Artikel & Opini</option>
            <option value="KARYA SANTRI">Karya Santri / Puisi</option>
            <option value="KEGIATAN">Jadwal & Kegiatan</option>
          </select>
        </div>
        <div class="form-group">
          <label for="post-image">Unggah Foto (Opsional)</label>
          <input type="file" id="post-image" accept="image/*">
        </div>
        <div class="form-group">
          <label for="post-content">Isi Postingan</label>
          <textarea id="post-content" rows="4" required placeholder="Tuliskan isi informasi di sini..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline btn-close-modal">Batal</button>
          <button type="submit" class="btn btn-primary">Terbitkan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL EDIT POSTINGAN -->
  <div id="modal-edit-post" class="modal-overlay hidden">
    <div class="modal">
      <h2>Edit Postingan</h2>
      <form id="form-edit-post">
        <input type="hidden" id="edit-post-id">
        <div class="form-group">
          <label for="edit-post-title">Judul Postingan</label>
          <input type="text" id="edit-post-title" required>
        </div>
        <div class="form-group">
          <label for="edit-post-category">Kategori</label>
          <select id="edit-post-category" required>
            <option value="PENGUMUMAN">Pengumuman</option>
            <option value="ARTIKEL">Artikel & Opini</option>
            <option value="KARYA SANTRI">Karya Santri / Puisi</option>
            <option value="KEGIATAN">Jadwal & Kegiatan</option>
          </select>
        </div>
        <div class="form-group">
          <label for="edit-post-image">Ganti Foto (Opsional)</label>
          <input type="file" id="edit-post-image" accept="image/*">
        </div>
        <div class="form-group">
          <label for="edit-post-content">Isi Postingan</label>
          <textarea id="edit-post-content" rows="4" required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline btn-close-modal">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL LOGIN -->
  <div id="modal-login" class="modal-overlay hidden">
    <div class="modal">
      <h2>Masuk ke Akun</h2>
      <form id="form-login">
        <div class="form-group">
          <label for="login-username">Username / ID Santri</label>
          <input type="text" id="login-username" required placeholder="Masukkan username">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline btn-close-modal">Batal</button>
          <button type="submit" class="btn btn-primary">Masuk</button>
        </div>
      </form>
      <div class="auth-toggle">
        Belum punya akun? <a href="#" id="link-to-register">Daftar di sini</a>
      </div>
    </div>
  </div>

  <!-- MODAL REGISTER -->
  <div id="modal-register" class="modal-overlay hidden">
    <div class="modal">
      <h2>Buat Akun Baru</h2>
      <form id="form-register">
        <div class="form-group">
          <label for="reg-name">Nama Lengkap</label>
          <input type="text" id="reg-name" required placeholder="Nama Lengkap Santri">
        </div>
        <div class="form-group">
          <label for="reg-username">Username / ID Santri</label>
          <input type="text" id="reg-username" required placeholder="Buat username unik">
        </div>

        <div class="form-group">
          <label for="reg-tingkat">Tingkat Kelas</label>
          <select id="reg-tingkat" required>
            <option value="">-- Pilih Kelas --</option>
            <option value="7">Kelas 7</option>
            <option value="8">Kelas 8</option>
            <option value="9">Kelas 9</option>
            <option value="10">Kelas 10</option>
            <option value="11">Kelas 11</option>
            <option value="12">Kelas 12</option>
          </select>
        </div>

        <div class="form-group hidden" id="group-jurusan">
          <label for="reg-jurusan">Jurusan</label>
          <select id="reg-jurusan">
            <option value="IPA">IPA (MIPA)</option>
            <option value="IPS">IPS (Social)</option>
            <option value="IPK">IPK (Keagamaan)</option>
          </select>
        </div>

        <div class="form-group hidden" id="group-subkelas">
          <label for="reg-subkelas">Sub-Kelas / Rombel</label>
          <select id="reg-subkelas">
            <option value="A">Kelas A</option>
            <option value="B">Kelas B</option>
            <option value="C">Kelas C</option>
            <option value="D">Kelas D</option>
            <option value="E">Kelas E</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required placeholder="••••••••">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline btn-close-modal">Batal</button>
          <button type="submit" class="btn btn-primary">Daftar</button>
        </div>
      </form>
      <div class="auth-toggle">
        Sudah punya akun? <a href="#" id="link-to-login">Masuk di sini</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
